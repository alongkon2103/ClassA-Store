<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Tikkies">
  <title>Tikkies</title>
  <defs>
    <linearGradient id="tk-tile" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#5f97cf"/>
      <stop offset="1" stop-color="#3d71aa"/>
    </linearGradient>
    <!-- วาดครึ่งเดียวแล้วสะท้อน — สมมาตรเป๊ะโดยไม่ต้องจูนสองข้าง -->
    <g id="tk-half" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31.1 30.6 20.6 18.6"/>
    </g>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tk-tile)"/>

  <!-- ริบบิ้นสะบัดขึ้นเป็นสองทาง = ของขวัญหนึ่งชิ้น ให้ผลได้หลายอย่าง -->
  <use href="#tk-half"/>
  <use href="#tk-half" transform="translate(64,0) scale(-1,1)"/>

  <g fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="15.2" y="32.6" width="33.6" height="8" rx="2.4"/>
    <path d="M18.8 40.6v12.4a2.4 2.4 0 0 0 2.4 2.4h21.6a2.4 2.4 0 0 0 2.4-2.4V40.6"/>
    <path d="M32 32.6v22.8"/>
  </g>

  <!-- ผลลัพธ์สองทาง — ทอง: รางวัลที่ได้ · ขาว: การกระทำถัดไป -->
  <circle cx="18.6" cy="16.4" r="4.7" fill="#e0b65c"/>
  <circle cx="45.4" cy="16.4" r="4.7" fill="#fff"/>
</svg>
